[workspace]
members = [".", "apps/desktop/src-tauri"]
resolver = "2"

[package]
name = "heightmap"
version = "0.8.1"
authors = ["Isaac <gpg@reheatedcake.io>"]
edition = "2024"
rust-version = "1.88"

[dependencies]
image = { version = "0.25.8", features = ["png"] }
clap = "4.5"
log = "0.4.28"
env_logger = "0.10.0"
eframe = { version = "0.33.3", optional = true }
poll-promise = { version = "0.2.0", optional = true }
brdb = "0.5.0"
egui = { version = "0.33.3", optional = true }
native-dialog = { version = "0.9.0", optional = true }
arboard = { version = "3", features = [
  "wayland-data-control",
], optional = true }
egui_extras = { version = "0.33.3", features = [
  "file",
  "image",
], optional = true }
egui-phosphor = { version = "0.11", optional = true }
walkers = { version = "0.52", optional = true }
# Always on: public `api` DTOs (Tauri/egui shells).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
# Always on: install-to-Brickadia + builds_dir for Tauri (default-features=false).
dirs = "5"
ureq = { version = "2.10", optional = true }
tiff = { version = "0.9", optional = true }
rayon = "1.11.0"

[features]
# Product UI is Tauri (apps/desktop). Default = dem core for tests/Tauri.
# Legacy egui: cargo build --release --features gui --bin heightmap_gui
default = ["dem"]
# DEM fetch+mesh+write without egui/walkers (Tauri path).
dem = ["dep:ureq", "dep:tiff", "dep:serde_json", "dep:toml"]
# DEPRECATED immediate-mode shell (heightmap_gui). Prefer Tauri.
gui = [
  "dem",
  "dep:egui",
  "dep:eframe",
  "dep:egui_extras",
  "dep:egui-phosphor",
  "dep:poll-promise",
  "dep:native-dialog",
  "dep:arboard",
  "dep:walkers",
]

[[bin]]
name = "heightmap_gui"
path = "src/gui_main.rs"
required-features = ["gui"]
