[package]
name = "brickadia-world-tools"
version = "0.1.0"
description = "Brickadia World Tools — Tauri shell (Convert first; Map/Sculpt next)"
authors = ["xgp0006"]
edition = "2021"

[lib]
name = "brickadia_world_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Core mesh/DEM/export — no egui. Path is repo root (workspace member).
heightmap = { path = "../../..", default-features = false }
tauri-plugin-dialog = "2"
